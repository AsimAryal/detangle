[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detangle-backend"
version = "0.1.0"
description = "Detangle audio separation backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
detangle = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
