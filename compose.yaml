name: detangle

services:
  detangle:
    build:
      context: .
      dockerfile: Dockerfile
    image: detangle:local
    container_name: detangle
    init: true
    ports:
      - "8009:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - detangle-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/healthz", timeout=5));
          assert data["status"] == "ok"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  detangle-data:
    name: detangle-data

